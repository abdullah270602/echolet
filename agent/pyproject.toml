[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "livekit>=1.0.23",
    "livekit-agents[deepgram,inworld,silero,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-openai>=1.3.9",
    "python-dotenv>=1.2.1",
    "asyncpg>=0.30.0",
    "boto3>=1.42.25",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["eval: behavioural eval that calls a real LLM"]
