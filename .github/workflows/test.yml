name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CLERK_JWKS_URL: "https://test.clerk.accounts.dev/.well-known/jwks.json"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      LIVEKIT_URL: "wss://test.livekit.cloud"
      LIVEKIT_API_KEY: "test_key"
      LIVEKIT_API_SECRET: "test_secret"
      OPENROUTER_API_KEY: "test_key"
      SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/123456789/test"
      AWS_REGION: "us-east-1"
      DAILY_TALK_LIMIT_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        working-directory: tests
        run: uv sync
      # Coverage scope (backend + worker) is set in tests/pyproject.toml.
      # Measured 73% when this gate was set; raise it as tests are added.
      - name: Run tests with coverage gate
        working-directory: tests
        run: uv run pytest --cov --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
