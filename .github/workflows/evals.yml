name: Agent evals

# Behavioural evals call real LLMs (a few cents per run), so they run nightly and on
# demand rather than on every push. Needs the OPENROUTER_API_KEY repo secret.
# The dataset includes cases the agent still fails, so the job gates on the overall
# pass rate (evals/check_threshold.py) rather than on every case passing.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run evals
        working-directory: agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv sync
          uv run pytest evals -n 6 -q || true   # individual failures are expected; gated below
      - name: Check pass rate
        working-directory: agent
        run: uv run python evals/check_threshold.py 0.55   # just under the current baseline: catches regressions
