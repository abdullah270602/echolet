[project]
name = "echolet-tests"
version = "0.1.0"
description = "Test suite for Echolet AI Receptionist Platform"
requires-python = ">=3.13"
dependencies = [
    # Testing framework
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",

    # HTTP mocking
    "respx>=0.22.0",
    "httpx>=0.28.0",

    # AWS mocking
    "moto[sqs]>=5.0.0",

    # Database testing
    "aiosqlite>=0.20.0",

    # Time mocking
    "freezegun>=1.4.0",

    # Async utilities
    "anyio>=4.0.0",

    # Required project dependencies for testing
    "fastapi>=0.125.0",
    "uvicorn>=0.38.0",
    "livekit-api>=0.7.0",
    "livekit-agents>=1.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "asyncpg>=0.30.0",
    "boto3>=1.42.25",
    "pydantic>=2.0.0",
    "fastapi-clerk-auth>=0.0.1",
]

[tool.uv]
dev-dependencies = []
